<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#082b3a">
<title>Prism Pond</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #082b3a; touch-action: none; overscroll-behavior: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; touch-action: none; }
  #score  { position: fixed; top: 12px; left: 16px; color: #fff; font: 600 22px system-ui, -apple-system, sans-serif; text-shadow: 0 1px 4px rgba(0,0,0,.4); pointer-events: none; user-select: none; }
  #zone   { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); color: #fff; font: 600 16px system-ui, -apple-system, sans-serif; text-shadow: 0 1px 4px rgba(0,0,0,.5); pointer-events: none; user-select: none; opacity: 0; transition: opacity .5s ease; letter-spacing: .04em; }
  #hint   { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); color: #cdebff; font: 500 16px system-ui, -apple-system, sans-serif; text-shadow: 0 1px 4px rgba(0,0,0,.4); pointer-events: none; user-select: none; opacity: .85; transition: opacity 1.2s ease; text-align: center; }
  #badges { position: fixed; top: 46px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; user-select: none; }
  .badge  { padding: 5px 11px; border-radius: 14px; font: 700 13px system-ui, -apple-system, sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,.35); color: #2a1a05; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score">⭐ 0</div>
<div id="zone"></div>
<div id="badges"></div>
<div id="hint">tap and drag anywhere to swim — chase the rainbow!</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const scoreEl  = document.getElementById('score');
  const zoneEl   = document.getElementById('zone');
  const hintEl   = document.getElementById('hint');
  const badgesEl = document.getElementById('badges');

  // --- audio: pentatonic chimes (no assets) ---
  let ac = null;
  const NOTES = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66]; // C5 D E G A C6 D6
  function ensureAudio() {
    if (ac) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function chime(i, vol = 0.16) {
    if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'triangle';
    o.frequency.value = NOTES[((i % NOTES.length) + NOTES.length) % NOTES.length];
    o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    o.start(t); o.stop(t + 0.6);
  }
  function arpeggio(steps, vol = 0.14) {
    if (!ac) return;
    steps.forEach((step, i) => {
      const t = ac.currentTime + i * 0.07;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = NOTES[((step % NOTES.length) + NOTES.length) % NOTES.length];
      o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.start(t); o.stop(t + 0.45);
    });
  }

  // --- canvas sizing ---
  let VW = 0, VH = 0; // viewport in CSS pixels
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    VW = window.innerWidth;
    VH = window.innerHeight;
    cv.width  = Math.round(VW * dpr);
    cv.height = Math.round(VH * dpr);
    cv.style.width  = VW + 'px';
    cv.style.height = VH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- world + camera ---
  const WORLD = { w: 4000, h: 2500 };
  const camera = { x: 0, y: 0 }; // top-left of viewport, in world coords

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // --- zones ---
  const ZONES = [
    { name: 'The Pond',          cx: WORLD.w * 0.50, cy: WORLD.h * 0.50, r: 950, color: '#1a5b7a', tint: 'rgba( 90,180,210,0.40)', poi: 'sunbeam', stars: 5,  cool: 6000  },
    { name: 'Sunshine Shallows', cx: WORLD.w * 0.50, cy: WORLD.h * 0.12, r: 720, color: '#7fb86f', tint: 'rgba(255,220,120,0.45)', poi: 'lilypad', stars: 3,  cool: 5000  },
    { name: 'Coral Garden',      cx: WORLD.w * 0.88, cy: WORLD.h * 0.55, r: 760, color: '#c84e6c', tint: 'rgba(230,110,150,0.42)', poi: 'coral',   stars: 5,  cool: 6000  },
    { name: 'Kelp Forest',       cx: WORLD.w * 0.12, cy: WORLD.h * 0.55, r: 760, color: '#2c6b4e', tint: 'rgba( 60,160,110,0.45)', poi: 'kelp',    stars: 3,  cool: 7000  },
    { name: 'Glowy Cave',        cx: WORLD.w * 0.50, cy: WORLD.h * 0.88, r: 720, color: '#3a2880', tint: 'rgba(120, 90,230,0.50)', poi: 'crystal', stars: 10, cool: 10000 },
  ];
  ZONES.forEach(z => { z.px = z.cx; z.py = z.cy; z.cooldownUntil = 0; z.touchR = 80; });

  function zoneAt(x, y) {
    let best = null, bestD = Infinity;
    for (const z of ZONES) {
      const d = Math.hypot(z.cx - x, z.cy - y);
      if (d < z.r && d < bestD) { best = z; bestD = d; }
    }
    return best;
  }

  // --- input: floating joystick (tap/drag anywhere) + WASD/arrows ---
  const JOY_MAX  = 80;
  const JOY_DEAD = 6;
  const joy = { active: false, ax: 0, ay: 0, cx: 0, cy: 0, dx: 0, dy: 0, mag: 0 };
  const keys = {};

  function joyUpdate() {
    const vx = joy.cx - joy.ax, vy = joy.cy - joy.ay;
    const m = Math.hypot(vx, vy);
    if (m < JOY_DEAD) { joy.dx = 0; joy.dy = 0; joy.mag = 0; return; }
    joy.dx = vx / m;
    joy.dy = vy / m;
    joy.mag = Math.min(m, JOY_MAX) / JOY_MAX;
  }
  function joyStart(sx, sy) { joy.active = true; joy.ax = sx; joy.ay = sy; joy.cx = sx; joy.cy = sy; joyUpdate(); ensureAudio(); }
  function joyMove (sx, sy) { if (!joy.active) return; joy.cx = sx; joy.cy = sy; joyUpdate(); }
  function joyEnd()         { joy.active = false; joy.dx = 0; joy.dy = 0; joy.mag = 0; }

  cv.addEventListener('mousedown',   e => { joyStart(e.clientX, e.clientY); });
  cv.addEventListener('mousemove',   e => { joyMove (e.clientX, e.clientY); });
  cv.addEventListener('mouseup',     ()=> { joyEnd(); });
  cv.addEventListener('mouseleave',  ()=> { joyEnd(); });
  cv.addEventListener('touchstart',  e => { e.preventDefault(); const t = e.touches[0]; joyStart(t.clientX, t.clientY); }, { passive: false });
  cv.addEventListener('touchmove',   e => { e.preventDefault(); const t = e.touches[0]; joyMove (t.clientX, t.clientY); }, { passive: false });
  cv.addEventListener('touchend',    e => { e.preventDefault(); joyEnd(); }, { passive: false });
  cv.addEventListener('touchcancel', e => { e.preventDefault(); joyEnd(); }, { passive: false });

  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; ensureAudio(); });
  window.addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

  // --- player unicorn (world coords) ---
  const unicorn = { x: WORLD.w / 2, y: WORLD.h / 2, angle: 0, wiggle: 0, speed: 0 };
  const BASE_SPEED = 360; // px/sec at full joystick deflection

  // --- trail ---
  const COLORS = ['#ff5577', '#ff8a3d', '#ffd23f', '#7be86c', '#4fc3f7', '#7c6bff', '#c768ff'];
  const POINT_R = 22;
  const BASE_COLLECT_R = 44;
  const TRAIL_LEN = 28;
  const FADE_IN = 1.2, HOLD = 3.0, FADE_OUT = 6.0;

  let trail = null;
  let nextTrailAt = 0;
  let score = 0;

  function makeTrail() {
    // spawn near fish so it's always visible in the viewport
    const spread = Math.max(VW, VH) * 0.55;
    const angA = rand(0, Math.PI * 2);
    const angB = angA + rand(Math.PI * 0.6, Math.PI * 1.4);
    const ax = clamp(unicorn.x + Math.cos(angA) * spread, 80, WORLD.w - 80);
    const ay = clamp(unicorn.y + Math.sin(angA) * spread, 80, WORLD.h - 80);
    const bx = clamp(unicorn.x + Math.cos(angB) * spread, 80, WORLD.w - 80);
    const by = clamp(unicorn.y + Math.sin(angB) * spread, 80, WORLD.h - 80);
    const ccx = (ax + bx) / 2 + rand(-spread * 0.4, spread * 0.4);
    const ccy = (ay + by) / 2 + rand(-spread * 0.4, spread * 0.4);
    const pts = [];
    for (let i = 0; i < TRAIL_LEN; i++) {
      const t = i / (TRAIL_LEN - 1);
      const x = (1 - t) * (1 - t) * ax + 2 * (1 - t) * t * ccx + t * t * bx;
      const y = (1 - t) * (1 - t) * ay + 2 * (1 - t) * t * ccy + t * t * by;
      pts.push({ x, y, idx: i, offset: -i * 0.04, collected: false, color: COLORS[i % COLORS.length] });
    }
    return { points: pts, born: performance.now() };
  }
  function pointAlpha(p, now) {
    const age = (now - trail.born) / 1000 + p.offset;
    if (age < 0) return 0;
    if (age < FADE_IN) return age / FADE_IN;
    if (age < FADE_IN + HOLD) return 1;
    const t = (age - FADE_IN - HOLD) / FADE_OUT;
    return t >= 1 ? 0 : 1 - t;
  }

  // --- power-ups ---
  const POWERUPS = {
    big:     { color: '#ffcb6b', label: 'BIG'     },
    fast:    { color: '#4fc3f7', label: 'FAST'    },
    sparkle: { color: '#ff6bd1', label: 'SPARKLE' },
  };
  const POWERUP_KINDS = Object.keys(POWERUPS);
  const POWERUP_COUNT = 32;
  const POWERUP_DURATION_MS = 12000;
  const POWERUP_RESPAWN_MS = 30000;
  const POWERUP_TOUCH_R = 50;
  const bubbles = [];
  const active = []; // { kind, until }

  function spawnBubble() {
    const kind = POWERUP_KINDS[Math.floor(Math.random() * POWERUP_KINDS.length)];
    bubbles.push({
      x: rand(180, WORLD.w - 180),
      y: rand(180, WORLD.h - 180),
      kind,
      color: POWERUPS[kind].color,
      bob: Math.random() * Math.PI * 2,
    });
  }
  for (let i = 0; i < POWERUP_COUNT; i++) spawnBubble();

  function activate(kind, now) {
    const ex = active.find(a => a.kind === kind);
    const until = now + POWERUP_DURATION_MS;
    if (ex) ex.until = Math.max(ex.until, until);
    else    active.push({ kind, until });
    renderBadges();
  }
  function pruneActive(now) {
    let changed = false;
    for (let i = active.length - 1; i >= 0; i--) {
      if (now >= active[i].until) { active.splice(i, 1); changed = true; }
    }
    if (changed) renderBadges();
  }
  function hasPower(kind, now) { return active.some(a => a.kind === kind && now < a.until); }
  function renderBadges() {
    badgesEl.innerHTML = active.map(a =>
      `<span class="badge" style="background:${POWERUPS[a.kind].color}">${POWERUPS[a.kind].label}</span>`
    ).join('');
  }

  // --- particles ---
  const particles = [];
  function burst(x, y, color, count = 14, speedMul = 1) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = (70 + Math.random() * 160) * speedMul;
      particles.push({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0, max: 0.55 + Math.random() * 0.45,
        size: 2.2 + Math.random() * 3.4,
        color,
      });
    }
  }
  function sparkleEmit(x, y, color) {
    particles.push({
      x: x + rand(-10, 10), y: y + rand(-10, 10),
      vx: rand(-25, 25), vy: rand(-40, 5),
      life: 0, max: 0.55,
      size: 2.2, color,
    });
  }

  // --- ambient ripples (world coords, near fish) ---
  const ripples = [];
  let nextRippleAt = 0;

  // --- POI drawing ---
  function drawPOI(z, now) {
    const t = now / 1000;
    const x = z.px, y = z.py;
    const ready = now >= z.cooldownUntil;
    const dim = ready ? 1.0 : 0.55;

    if (z.poi === 'sunbeam') {
      const pulse = 0.7 + Math.sin(t * 0.9) * 0.3;
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.12);
      for (let i = 0; i < 8; i++) {
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = `rgba(255,235,170,${0.10 * pulse * dim})`;
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(220, -34); ctx.lineTo(220, 34); ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
      const grad = ctx.createRadialGradient(x, y, 10, x, y, 260);
      grad.addColorStop(0, `rgba(255,235,150,${0.55 * pulse * dim})`);
      grad.addColorStop(0.55, 'rgba(255,210,90,0.22)');
      grad.addColorStop(1, 'rgba(255,210,90,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, 260, 0, Math.PI * 2); ctx.fill();
    } else if (z.poi === 'lilypad') {
      const pads = [
        [   0,    0, 70, 18, 0.0],
        [-110,  -50, 55, 14, 0.3],
        [  90,  -80, 60, 16, 0.5],
        [ -60,  100, 50, 14, 0.8],
        [ 130,   70, 65, 18, 1.1],
      ];
      pads.forEach((p, i) => {
        const bob = Math.sin(t * 1.2 + i) * 4;
        const px = x + p[0], py = y + p[1] + bob;
        ctx.fillStyle = `rgba(61, 138, 77, ${dim})`;
        ctx.beginPath(); ctx.ellipse(px, py, p[2], p[2] * 0.85, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#082b3a';
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + p[2] * 0.95, py - p[2] * 0.22);
        ctx.lineTo(px + p[2] * 0.95, py + p[2] * 0.22);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = `rgba(255,234,255,${dim})`;
        ctx.beginPath(); ctx.arc(px - p[2] * 0.25, py, p[3] * 0.55, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = `rgba(255,189,107,${dim})`;
        ctx.beginPath(); ctx.arc(px - p[2] * 0.25, py, p[3] * 0.20, 0, Math.PI * 2); ctx.fill();
      });
    } else if (z.poi === 'coral') {
      const branches = [
        [[0, 60], [0, -30], [-40, -100], [-30, -160]],
        [[0, -30], [40, -90], [70, -140]],
        [[0, 20], [-60, 0], [-110, -20]],
        [[0, 20], [60, 30], [110, 40]],
        [[0, 60], [30, 100], [50, 130]],
      ];
      ctx.strokeStyle = `rgba(255,138,168,${dim})`;
      ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      branches.forEach(b => {
        ctx.beginPath();
        b.forEach((p, i) => i === 0 ? ctx.moveTo(x + p[0], y + p[1]) : ctx.lineTo(x + p[0], y + p[1]));
        ctx.stroke();
      });
      ctx.strokeStyle = `rgba(255,194,209,${dim})`;
      ctx.lineWidth = 7;
      branches.forEach(b => {
        ctx.beginPath();
        b.forEach((p, i) => i === 0 ? ctx.moveTo(x + p[0], y + p[1]) : ctx.lineTo(x + p[0], y + p[1]));
        ctx.stroke();
      });
      branches.forEach(b => {
        const tip = b[b.length - 1];
        ctx.fillStyle = `rgba(255,240,224,${dim})`;
        ctx.beginPath(); ctx.arc(x + tip[0], y + tip[1], 10, 0, Math.PI * 2); ctx.fill();
      });
    } else if (z.poi === 'kelp') {
      const fronds = [
        [-110, 26],
        [ -40, 20],
        [  40, 24],
        [ 110, 22],
        [ 170, 18],
        [-170, 18],
      ];
      fronds.forEach((f, i) => {
        const phase = t * 0.8 + i * 0.7;
        ctx.strokeStyle = `rgba(58, 138, 91, ${dim})`;
        ctx.lineWidth = f[1]; ctx.lineCap = 'round';
        ctx.beginPath();
        for (let s = 0; s <= 280; s += 12) {
          const sx = x + f[0] + Math.sin(phase + s * 0.025) * 18;
          const sy = y + 220 - s;
          if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        ctx.stroke();
        ctx.strokeStyle = `rgba(180,240,180,${0.35 * dim})`;
        ctx.lineWidth = f[1] * 0.4;
        ctx.beginPath();
        for (let s = 0; s <= 280; s += 12) {
          const sx = x + f[0] + Math.sin(phase + s * 0.025) * 18;
          const sy = y + 220 - s;
          if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        ctx.stroke();
      });
    } else if (z.poi === 'crystal') {
      const pulse = 0.6 + Math.sin(t * 1.6) * 0.4;
      const grad = ctx.createRadialGradient(x, y, 10, x, y, 240);
      grad.addColorStop(0, `rgba(180,140,255,${0.55 * pulse * dim})`);
      grad.addColorStop(0.55, 'rgba(140, 90,230,0.18)');
      grad.addColorStop(1, 'rgba(80, 40,180,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, 240, 0, Math.PI * 2); ctx.fill();
      const crystals = [
        [   0,   0, 36, 110],
        [ -55,  20, 28,  80],
        [  60,  30, 30,  90],
        [ -30,  55, 24,  62],
        [  36,  65, 26,  70],
      ];
      crystals.forEach(c => {
        const cx = x + c[0], cy = y + c[1];
        ctx.fillStyle = `rgba(190,160,255,${(0.7 + pulse * 0.3) * dim})`;
        ctx.beginPath();
        ctx.moveTo(cx, cy - c[3] / 2);
        ctx.lineTo(cx + c[2] / 2, cy);
        ctx.lineTo(cx, cy + c[3] / 2);
        ctx.lineTo(cx - c[2] / 2, cy);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = `rgba(255,255,255,${0.45 * dim})`;
        ctx.beginPath();
        ctx.moveTo(cx, cy - c[3] / 2);
        ctx.lineTo(cx - 5, cy);
        ctx.lineTo(cx, cy + c[3] / 2);
        ctx.closePath(); ctx.fill();
      });
    }
  }

  // --- zone label fader ---
  let currentZone = null;
  let zoneFadeUntil = 0;
  function updateZoneLabel(now) {
    const z = zoneAt(unicorn.x, unicorn.y);
    if (z && z !== currentZone) {
      currentZone = z;
      zoneEl.textContent = z.name;
      zoneEl.style.opacity = '1';
      zoneFadeUntil = now + 2400;
    }
    if (now > zoneFadeUntil && zoneEl.style.opacity !== '0') {
      zoneEl.style.opacity = '0';
    }
  }

  // --- main loop ---
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    // unicorn update — joystick OR WASD/arrows
    let inX = 0, inY = 0;
    if (joy.mag > 0) {
      inX = joy.dx * joy.mag;
      inY = joy.dy * joy.mag;
    } else {
      if (keys['w'] || keys['arrowup'])    inY -= 1;
      if (keys['s'] || keys['arrowdown'])  inY += 1;
      if (keys['a'] || keys['arrowleft'])  inX -= 1;
      if (keys['d'] || keys['arrowright']) inX += 1;
      const km = Math.hypot(inX, inY);
      if (km > 1) { inX /= km; inY /= km; }
    }
    const speedMul = hasPower('fast', now) ? 1.7 : 1.0;
    const vx = inX * BASE_SPEED * speedMul;
    const vy = inY * BASE_SPEED * speedMul;
    unicorn.x += vx * dt;
    unicorn.y += vy * dt;
    unicorn.speed = Math.hypot(vx, vy);
    if (unicorn.speed > 5) unicorn.angle = Math.atan2(vy, vx);
    unicorn.wiggle += dt * (5 + Math.min(unicorn.speed, 400) * 0.03);
    unicorn.x = clamp(unicorn.x, 40, WORLD.w - 40);
    unicorn.y = clamp(unicorn.y, 40, WORLD.h - 40);

    // camera follow + clamp
    camera.x += (unicorn.x - VW / 2 - camera.x) * 0.10;
    camera.y += (unicorn.y - VH / 2 - camera.y) * 0.10;
    camera.x = clamp(camera.x, 0, Math.max(0, WORLD.w - VW));
    camera.y = clamp(camera.y, 0, Math.max(0, WORLD.h - VH));

    pruneActive(now);
    updateZoneLabel(now);

    // --- background ---
    ctx.fillStyle = '#082b3a';
    ctx.fillRect(0, 0, VW, VH);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // zone gradient tints
    ZONES.forEach(z => {
      if (z.cx + z.r < camera.x || z.cx - z.r > camera.x + VW ||
          z.cy + z.r < camera.y || z.cy - z.r > camera.y + VH) return;
      const grad = ctx.createRadialGradient(z.cx, z.cy, 0, z.cx, z.cy, z.r);
      grad.addColorStop(0, z.tint);
      grad.addColorStop(1, 'rgba(8,43,58,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(z.cx, z.cy, z.r, 0, Math.PI * 2); ctx.fill();
    });

    // ambient ripples (near fish so always visible)
    if (now > nextRippleAt) {
      ripples.push({
        x: unicorn.x + rand(-VW * 0.8, VW * 0.8),
        y: unicorn.y + rand(-VH * 0.8, VH * 0.8),
        life: 0, max: rand(2.5, 4.0), grow: rand(28, 55),
      });
      nextRippleAt = now + rand(450, 1300);
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life += dt;
      if (r.life > r.max) { ripples.splice(i, 1); continue; }
      const tt = r.life / r.max;
      ctx.strokeStyle = `rgba(180,220,240,${Math.max(0, 0.22 - tt * 0.22)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.life * r.grow, 0, Math.PI * 2); ctx.stroke();
    }

    // POIs in view + touch reward
    ZONES.forEach(z => {
      const inView = !(z.px + 320 < camera.x || z.px - 320 > camera.x + VW ||
                       z.py + 320 < camera.y || z.py - 320 > camera.y + VH);
      if (inView) drawPOI(z, now);
      // proximity reward (anywhere — works even if POI is just offscreen)
      if (now >= z.cooldownUntil && Math.hypot(z.px - unicorn.x, z.py - unicorn.y) < z.touchR) {
        score += z.stars;
        scoreEl.textContent = '⭐ ' + score;
        const burstColor = z.poi === 'sunbeam' ? '#ffdc6b'
                         : z.poi === 'lilypad' ? '#ffeaff'
                         : z.poi === 'coral'   ? '#ff8aa8'
                         : z.poi === 'kelp'    ? '#7be86c'
                         :                       '#c4a8ff';
        burst(z.px, z.py, burstColor, 22, 1.1);
        arpeggio(z.poi === 'crystal' ? [4, 6, 8, 10] : [0, 2, 4]);
        z.cooldownUntil = now + z.cool;
        hintEl.style.opacity = '0';
      }
    });

    // bubble updates + collection
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (Math.hypot(b.x - unicorn.x, b.y - unicorn.y) < POWERUP_TOUCH_R) {
        bubbles.splice(i, 1);
        activate(b.kind, now);
        burst(b.x, b.y, b.color, 22, 0.9);
        arpeggio([0, 3, 5, 7]);
        setTimeout(spawnBubble, POWERUP_RESPAWN_MS);
        continue;
      }
      // skip offscreen
      if (b.x + 40 < camera.x || b.x - 40 > camera.x + VW ||
          b.y + 40 < camera.y || b.y - 40 > camera.y + VH) continue;
      b.bob += dt;
      const yo = Math.sin(b.bob * 1.5) * 5;
      const x = b.x, y = b.y + yo;
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.arc(x, y, 24, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = b.color;
      if (b.kind === 'big') {
        ctx.beginPath(); ctx.ellipse(x - 1, y, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x - 11, y); ctx.lineTo(x - 17, y - 6); ctx.lineTo(x - 17, y + 6); ctx.closePath();
        ctx.fill();
      } else if (b.kind === 'fast') {
        ctx.beginPath();
        ctx.moveTo(x + 4,  y - 12);
        ctx.lineTo(x - 6,  y + 2);
        ctx.lineTo(x,      y + 2);
        ctx.lineTo(x - 4,  y + 12);
        ctx.lineTo(x + 8,  y - 3);
        ctx.lineTo(x + 2,  y - 3);
        ctx.closePath(); ctx.fill();
      } else { // sparkle
        ctx.beginPath();
        for (let k = 0; k < 8; k++) {
          const ang = (k / 8) * Math.PI * 2 - Math.PI / 2;
          const r = (k % 2 === 0) ? 12 : 5;
          const sx = x + Math.cos(ang) * r;
          const sy = y + Math.sin(ang) * r;
          if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.arc(x - 8, y - 8, 4, 0, Math.PI * 2); ctx.fill();
    }

    // trail spawn + draw + collect
    if (!trail && now > nextTrailAt) trail = makeTrail();
    if (trail) {
      let allDone = true;
      const collectR = hasPower('big', now) ? BASE_COLLECT_R + 16 : BASE_COLLECT_R;
      for (let i = 0; i < trail.points.length; i++) {
        const p = trail.points[i];
        if (p.collected) continue;
        const a = pointAlpha(p, now);
        if (a > 0.02) allDone = false;
        if (a > 0.15 && Math.hypot(p.x - unicorn.x, p.y - unicorn.y) < collectR) {
          p.collected = true;
          score += 1;
          scoreEl.textContent = '⭐ ' + score;
          burst(p.x, p.y, p.color);
          chime(p.idx);
          if (score >= 6) hintEl.style.opacity = '0';
          continue;
        }
        if (a <= 0.01) continue;
        if (p.x + POINT_R * 2 < camera.x || p.x - POINT_R * 2 > camera.x + VW ||
            p.y + POINT_R * 2 < camera.y || p.y - POINT_R * 2 > camera.y + VH) continue;
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, POINT_R * 2);
        grad.addColorStop(0,    hexA(p.color, a * 0.90));
        grad.addColorStop(0.55, hexA(p.color, a * 0.30));
        grad.addColorStop(1,    hexA(p.color, 0));
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p.x, p.y, POINT_R * 2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = hexA('#ffffff', a * 0.85);
        ctx.beginPath(); ctx.arc(p.x, p.y, POINT_R * 0.42, 0, Math.PI * 2); ctx.fill();
      }
      if (allDone) { trail = null; nextTrailAt = now + 700; }
    }

    // sparkle-trail emission (when SPARKLE power-up is active)
    if (hasPower('sparkle', now) && Math.random() < 0.7) {
      sparkleEmit(unicorn.x, unicorn.y, '#ff6bd1');
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      const tt = p.life / p.max;
      if (tt >= 1) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
      ctx.fillStyle = hexA(p.color, 1 - tt);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1 - tt * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }

    drawUnicorn(now);

    ctx.restore();

    // UI (screen space)
    drawJoystick();

    requestAnimationFrame(frame);
  }

  const RAINBOW = ['#ff5577', '#ff8a3d', '#ffd23f', '#7be86c', '#4fc3f7', '#7c6bff', '#c768ff'];

  function drawUnicorn(now) {
    const big = hasPower('big', now);
    const scale = big ? 1.7 : 1.0;
    const wig = Math.sin(unicorn.wiggle) * (0.5 + Math.min(unicorn.speed, 300) / 600);
    const wag = Math.sin(unicorn.wiggle * 1.2) * 8;

    // wake — surface ripples trailing behind, drawn in world space (no rotation)
    const wake = Math.min(0.55, unicorn.speed / 420);
    if (wake > 0.05) {
      ctx.save();
      ctx.translate(unicorn.x, unicorn.y);
      ctx.rotate(unicorn.angle);
      ctx.strokeStyle = `rgba(200,230,255,${wake})`;
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 3; i++) {
        const off = -(24 + i * 14) * scale;
        ctx.beginPath();
        ctx.ellipse(off, 0, (12 + i * 9) * scale, (5 + i * 3) * scale, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.translate(unicorn.x, unicorn.y);
    ctx.rotate(unicorn.angle);
    ctx.scale(scale, scale);

    // tail — rainbow streamers behind
    ctx.lineCap = 'round';
    for (let i = 0; i < RAINBOW.length; i++) {
      ctx.strokeStyle = RAINBOW[i];
      ctx.lineWidth = 2.4;
      const baseY = -7 + i * (14 / (RAINBOW.length - 1));
      ctx.beginPath();
      ctx.moveTo(-16, baseY * 0.35);
      ctx.quadraticCurveTo(-28, baseY + wag * 0.4, -44 + wig * 4, baseY + wag);
      ctx.stroke();
    }

    // water-line shadow under body (submerged hint)
    ctx.fillStyle = 'rgba(40, 80, 110, 0.28)';
    ctx.beginPath(); ctx.ellipse(0, 6, 22, 5, 0, 0, Math.PI * 2); ctx.fill();

    // body — soft white
    const bodyGrad = ctx.createLinearGradient(-20, -8, 20, 8);
    bodyGrad.addColorStop(0, '#ffffff');
    bodyGrad.addColorStop(1, '#f1e8ff');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(190,170,220,0.7)'; ctx.lineWidth = 1;
    ctx.stroke();

    // paddling legs — tiny ripples under body
    const legPhase = unicorn.wiggle * 1.6;
    ctx.fillStyle = 'rgba(220,235,255,0.55)';
    for (let i = 0; i < 2; i++) {
      const lx = -4 + i * 12;
      const ly = 10 + Math.sin(legPhase + i * Math.PI) * 1.5;
      ctx.beginPath(); ctx.ellipse(lx, ly, 3, 1.6, 0, 0, Math.PI * 2); ctx.fill();
    }

    // head
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(17, -3, 10, 7, -0.15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(190,170,220,0.7)'; ctx.lineWidth = 1; ctx.stroke();

    // mane — rainbow streamers from neck/back of head
    for (let i = 0; i < RAINBOW.length; i++) {
      ctx.strokeStyle = RAINBOW[i];
      ctx.lineWidth = 2.2;
      const baseY = -9 + i * (16 / (RAINBOW.length - 1));
      ctx.beginPath();
      ctx.moveTo(11, baseY * 0.4 - 4);
      ctx.quadraticCurveTo(0, baseY * 0.7 - 4 + wag * 0.25, -10, baseY - 3 + wag * 0.5);
      ctx.stroke();
    }

    // ear
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(17, -8); ctx.lineTo(20, -13); ctx.lineTo(22, -7); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,180,210,0.7)';
    ctx.beginPath();
    ctx.moveTo(18, -8.5); ctx.lineTo(20, -11.5); ctx.lineTo(21, -8); ctx.closePath();
    ctx.fill();

    // horn — golden, pointing forward
    ctx.save();
    ctx.translate(22, -7);
    ctx.rotate(-0.35);
    const hornGrad = ctx.createLinearGradient(0, 0, 14, 0);
    hornGrad.addColorStop(0, '#fff3a8');
    hornGrad.addColorStop(1, '#ffb83c');
    ctx.fillStyle = hornGrad;
    ctx.beginPath();
    ctx.moveTo(0, -2.2); ctx.lineTo(14, 0); ctx.lineTo(0, 2.2); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(170,110,30,0.75)'; ctx.lineWidth = 0.8;
    for (let s = 0; s < 3; s++) {
      ctx.beginPath();
      ctx.moveTo(2 + s * 4, -1.6);
      ctx.lineTo(4 + s * 4,  1.6);
      ctx.stroke();
    }
    ctx.restore();

    // eye
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(21, -3, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(21.4, -3.4, 0.6, 0, Math.PI * 2); ctx.fill();

    // cheek blush
    ctx.fillStyle = 'rgba(255,170,200,0.55)';
    ctx.beginPath(); ctx.arc(19, 1, 2, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  // --- joystick overlay (screen space) ---
  function drawJoystick() {
    if (!joy.active) return;
    const vx = joy.cx - joy.ax, vy = joy.cy - joy.ay;
    const m = Math.hypot(vx, vy);
    const cm = Math.min(m, JOY_MAX);
    const kx = joy.ax + (m > 0 ? vx / m : 0) * cm;
    const ky = joy.ay + (m > 0 ? vy / m : 0) * cm;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ax, joy.ay, JOY_MAX, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(kx, ky, 22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function hexA(hex, a) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const r = parseInt(h.substr(0, 2), 16);
    const g = parseInt(h.substr(2, 2), 16);
    const b = parseInt(h.substr(4, 2), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
